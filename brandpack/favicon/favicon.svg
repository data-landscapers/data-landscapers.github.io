<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Data Landscapers">
  <!--
    Simplified favicon for very small sizes (16x16, 32x32).
    Just the magnifying glass — large lens filling most of the canvas with the
    terracotta dot inside, plus a stubby 45-degree handle.

    This is paired with the full favicon.svg (which shows Africa's east coast
    and the magnifying glass) for use at larger sizes.

    Toggle cream background by uncommenting the <rect>.
  -->
  <!-- <rect width="64" height="64" fill="#F5F1E8"/> -->

  <g>
    <!-- Large lens centred slightly up-left to make room for the handle -->
    <circle cx="26" cy="26" r="20" fill="none" stroke="#1A2238" stroke-width="5"/>
    <!-- Terracotta dot — sized to dominate the lens interior -->
    <circle cx="26" cy="26" r="9" fill="#C25B3F"/>
    <!-- Stubby 45-degree handle, attached at the lens lower-right -->
    <g transform="translate(40.14,40.14) rotate(45)">
      <rect x="0" y="-4.5" width="18" height="9" rx="4.5" ry="4.5"
            fill="#7B8CA8" stroke="#1A2238" stroke-width="3"/>
    </g>
  </g>
</svg>

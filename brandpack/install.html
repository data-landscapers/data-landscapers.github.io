<!--
  Drop these tags into your site's <head> (or your Zensical theme's head partial).
  Adjust the paths if your favicons live under a sub-folder e.g. /assets/favicon/.
-->

<!-- Standard favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico" />

<!-- Modern browsers: vector SVG (sharp at every size, supports light/dark) -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<!-- Explicit raster fallbacks -->
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />

<!-- iOS home-screen icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<!-- PWA / Android web manifest -->
<link rel="manifest" href="/site.webmanifest" />

<!-- Browser UI theme -->
<meta name="theme-color" content="#1A2238" />

- date: November 2024
  title: "Exploring the Impact of the Digitalization Legal & Policy Framework on Inclusive Development in Uganda"
  author: "Bernard Sabiti, Edwin Akugizibwe & Johnstone Baguma"
  url: https://torodev.co.ug/wp-content/uploads/2025/04/ToroDev-GIZ-Digitalization-Legal-Framework-and-Inclusive-Development-in-Uganda-Report-2024.pdf
  category: Governance
  description: "The study sought to understand citizen perceptions of the legal and policy framework, the perceived impact on citizens’ use and consumption of digital services, how the laws facilitated development of a digital economy, and how inclusive that growth is, and what the challenges and gaps are."

- date: September 2024
  title: "Digital Compacts: Global Ideals, Regional Realities"
  author: "Bill Anderson"
  url: /assets/pdfs/2024-digital-compacts-global-ideals-regional-realities.pdf
  category: Governance
  description: |
    The [Global Digital Compact](https://www.un.org/techenvoy/global-digital-compact) was adopted as part of the UN Summit of the Future in September 2024. This discussion paper critiques the compact and compares it with the [African Digital Compact](https://au.int/en/documents/20240809/african-digital-compact-adc)

- date: June 2024
  title: "Data can drive shared prosperity for governments, businesses, and citizens. Unlocking it requires trusted data exchange."
  author: "Bernard Sabiti, Jonathan Dolan & Sarthak Satapathy"
  url: https://dial.global/wp-content/uploads/2024/06/Data-exchange-insights-paper-final.pdf
  category: Governance
  description: "The country experiences and resulting insights in Bangladesh, Rwanda, Uganda and Ghana illuminate critical shared experiences for policymakers and government technology leaders as they navigate the complexities of implementing effective national data exchange systems."

- date: October 2023
  title: "Data Governance: Do all global problems require global solutions?"
  author: "Bill Anderson"
  url: https://devinit.github.io/blog/data-governance-does-it-require-a-global-solution-/
  category: Governance
  description: A blog originally published on the DI website highlights some of the complexities in aiming for a global consensus on digital or data governance.

- date: September 2023
  title: "Africa has leapfrogged its way to becoming a leader in digital payments. Could it do the same with DPI?"
  author: "Bernard Sabiti"
  url: https://dial.global/africa-digital-public-infrastructure-progress/
  category: Governance
  description: "Good DPI generally consists of three core systems working in sync, namely, those regarding digital identity, digital payments, data exchange, as well as consent mechanisms, where data owners have a say on how, where, and when their data is moved around. When these building blocks co-exist, are interoperable, and have inbuilt tech and governance attributes including data privacy, accountability and oversight mechanisms, the benefits can be enormous."

- date: July 2023
  title: "How Digital Technology is Impacting Health Data Governance in Africa: The Case of Uganda"
  author: "Bernard Sabiti"
  url: https://cipesa.org/2023/07/how-technology-is-impacting-health-data-governance-in-africa-the-case-of-uganda/
  category: Governance
  description: "In the wake of the Coronavirus Disease 2019 (Covid-19), countries in Africa, like their counterparts across the world, have dramatically increased the use of digital technologies in the health sector, including in diagnosis, disease surveillance, education, research, data management, and care delivery."

- date: May 2023
  title: "SDG learnings from the World Data Forum in Hangzhou: Falling between stools and masters"
  author: "Bill Anderson & Claudia Wells"
  url: https://devinit.github.io/blog/sdg-learnings-world-data-forum-hangzhou/ 
  category: Governance
  description: "The UN World Data Forum took place in Hangzhou, China in April 2023. As a UN conference, aimed at spurring innovation, partnerships and high-level political and financial support, the forum can tend towards diplomacy over discussion, with government and multilateral officials and statisticians lining up to politely agree with each other and champion success. We set out to invigorate proceedings with a debate on ‘Is the SDG Monitoring Framework Broken?’, which drew on our recent discussion paper of the same name."

- date: April 2023
  title: "Is the SDG monitoring framework broken?"
  author: "Bill Anderson"
  url: /assets/pdfs/2023-is-the-sdg-monitoring-framework-broken.pdf
  category: Governance
  description: In March 2023, the UN Economic and Social Commission for Asia and the Pacific published its annual SDG progress report. It warned that the region requires, at the current rate of progress, a further 42 years to meet the SDGs. It also revealed that there remains insufficient data to monitor 51 of the 169 targets. This discussion paper focused on the SDG global monitoring system from a data perspective.

- date: November 2022
  title: "UN joint programming on strengthening Malaysia's national system on monitoring & evaluation for the SDGs: Final Report"
  author: "Bill Anderson"
  url: /assets/pdfs/2022-malaysia-final.pdf
  category: Landscaping
  description: Final report for UNICEF Malaysia country office. The overall objective of this assignment was to work with the Department of Statistics (DOSM) to explore and facilitate implementation of pragmatic solutions for government ministries, departments and agencies to provide data to populate 34 SDG indicators not reported by the Government of Malaysia. More details are available in the accompanying [Technical Report](/assets/pdfs/2022-malaysia-technical.pdf).

- date: October 2022
  title: "The role of global custodians in supporting Malaysia’s SDG monitoring framework: Case Study"
  author: "Bill Anderson"
  url: /assets/pdfs/2022-malaysia-custodian-study.pdf
  category: Governance
  description: |
    My work in Malaysia for the UNICEF country office exposed a number of obstacles that appear to exist globally in the relationship between national statistics offices (NSOs) and the international agencies (custodians) responsible for curating the SDGs. This study shines a light on these challenges within the context of the commitments made by all parties involved in the governance of the SDGs. This work formed the basis of my paper: ["Is the SDG Monitoring Framework Broken?"](/assets/pdfs/2023-is-the-sdg-monitoring-framework-broken.pdf)

- date: October 2022
  title: "Five Takeaways From the 2022 African Union Data Policy Framework"
  author: "Bernard Sabiti"
  url: https://cipesa.org/wp-content/files/briefs/Five_Takeaways_From_the_2022_African_Union_Data_Policy_Framework_Brief.pdf
  category: Governance
  description: "The Africa Union Data Policy Framework published in July 2022 is one of the most significant instruments on data governance on the continent. This review examines the Policy Framework from five angles: The background of the Policy Framework’s development; What the Policy Framework entails; Benefits and opportunities it can deliver to data governance, data rights and privacy; The Policy Framework’s likely implementation challenges; and Suggestions for the way forward."
 
- date: March 2022
  title: "Data disharmony: How can donors better act on their commitments?"
  author: "Bill Anderson & Bernard Sabiti"
  url: /assets/pdfs/2022-data-disharmony.pdf
  category: Governance
  description: "This paper examines the role of donors investment in national data ecosystems, focusing in particular on the challenges of harmonisation. The issues we describe here are not new – they are well-known and have been recognised by donors themselves over many years. Rather than simply re-stating the problem, the purpose of this paper to promote an open discussion about why – given longstanding commitments to address these issues – progress has been limited, and what both donors and national governments can do to overcome the challenges of harmonisation in order to maximise the impact of their investments in national data systems."

